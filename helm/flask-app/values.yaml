replicaCount: 2

app:
  name: flask-app

image:
  repository: ""
  tag: latest
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 5000
  targetPort: 5000

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "5000"

environment: dev

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 25

monitoring:
  enabled: true
  serviceMonitor:
    enabled: false

livenessProbe:
  path: /health
  initialDelaySeconds: 20
  periodSeconds: 15

readinessProbe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
