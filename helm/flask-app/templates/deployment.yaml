apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-app

spec:

  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: flask-app

  template:

    metadata:
      labels:
        app: flask-app
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

    spec:

      containers:

      - name: flask-app

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        imagePullPolicy: {{ .Values.image.pullPolicy }}

        ports:

        - containerPort: 5000

        env:

        - name: ENVIRONMENT

          value: "{{ .Values.environment }}"

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

        resources:
          {{- toYaml .Values.resources | nindent 10 }}
